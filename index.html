<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5e9">
  <title>花鳥蓋印所 — 國風圖樣小遊戲</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Avenir Next", Avenir, "Noto Sans TC", "PingFang TC", sans-serif;
      color: #293d31;
      background: #f8f5e9;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --leaf: #64845c;
      --deep-leaf: #37563f;
      --paper: #ffffff;
      --muted: #788274;
      --vermilion: #a9362b;
      --gold: #bd9652;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 8% 8%, rgba(223, 229, 197, .58), transparent 34rem),
        radial-gradient(ellipse at 92% 88%, rgba(239, 218, 180, .38), transparent 33rem),
        #f8f5e9;
    }

    button { font: inherit; }

    .page {
      width: min(1320px, calc(100% - 48px));
      margin: 0 auto;
      padding: 30px 0 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid rgba(169, 54, 43, .48);
      border-radius: 10px;
      color: var(--vermilion);
      background: #fffaf3;
      box-shadow: inset 0 0 0 3px #fffaf3, inset 0 0 0 4px rgba(169, 54, 43, .28);
      font-family: "Noto Serif TC", "Songti TC", serif;
      font-size: 18px;
      font-weight: 800;
    }

    .season-tag {
      padding: 8px 13px;
      border: 1px solid rgba(83, 106, 73, .15);
      border-radius: 99px;
      color: #65735d;
      background: rgba(255, 253, 246, .62);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .07em;
    }

    .intro {
      margin-bottom: 27px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #82916f;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .2em;
    }

    h1 {
      margin: 0;
      color: #304b38;
      font-family: Georgia, "Noto Serif TC", serif;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 700;
      letter-spacing: .06em;
    }

    .subtitle {
      margin: 10px 0 0;
      color: #7d8578;
      font-size: 14px;
      letter-spacing: .035em;
    }

    .game-card {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 18px;
      padding: 0;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      padding: 18px 8px 12px 10px;
    }

    .section-label {
      margin: 0 0 13px;
      color: #75816d;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .15em;
    }

    .pattern-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .pattern-option {
      display: flex;
      min-height: 82px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 4px;
      border: 1px solid #e8ded1;
      border-radius: 12px;
      color: #596653;
      background: #fffdfa;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .pattern-option:hover { transform: translateY(-2px); }

    .pattern-option[aria-pressed="true"] {
      border-color: var(--vermilion);
      background: #fff8f1;
      box-shadow: 0 0 0 2px rgba(169, 54, 43, .1);
    }

    .pattern-option:disabled { cursor: default; opacity: .72; }
    .pattern-list[hidden], .pattern-option[hidden], .target[hidden], .fabric-output[hidden], .download[hidden] { display: none; }

    .pattern-preview {
      width: 42px;
      height: 42px;
      border: 1px solid #e8d6c6;
      border-radius: 50%;
      background: #fff;
      object-fit: cover;
    }

    .pattern-name { color: #685344; font-size: 11px; font-weight: 700; }

    .instruction {
      margin: 19px 0 0;
      padding: 13px 14px;
      border-radius: 14px;
      color: #64715e;
      background: #f1f1e5;
      font-size: 12px;
      line-height: 1.8;
    }

    .instruction strong { color: #405944; }

    .game-status {
      min-height: 34px;
      margin: 10px 0 0;
      color: #8b5c4c;
      font-size: 11px;
      line-height: 1.6;
    }

    .progress-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding: 17px 3px 4px;
    }

    .progress-label {
      color: #7b8476;
      font-size: 12px;
    }

    .progress-count {
      color: #476448;
      font-family: Georgia, serif;
      font-size: 22px;
      font-weight: 700;
    }

    .progress-count small {
      color: #9aa091;
      font-family: inherit;
      font-size: 14px;
      font-weight: 400;
    }

    .reset {
      width: 100%;
      margin-top: 9px;
      padding: 10px 14px;
      border: 1px solid #dfe3d3;
      border-radius: 12px;
      color: #65745f;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: background .18s ease;
    }

    .reset:hover { background: #f2f3e9; }

    .finish-leaves {
      width: 100%;
      margin-top: 9px;
      padding: 11px 14px;
      border: 0;
      border-radius: 12px;
      color: #fffaf3;
      background: var(--vermilion);
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
    }

    .finish-leaves:hover { background: #8f2d25; }
    .finish-leaves:disabled { cursor: not-allowed; opacity: .48; }
    .finish-leaves[hidden] { display: none; }

    .fabric-output {
      display: grid;
      gap: 8px;
      margin-top: 16px;
      text-align: center;
    }

    .fabric-preview {
      display: block;
      width: 100%;
      max-height: 190px;
      border: 1px solid #e8ded1;
      object-fit: contain;
      background: #fffaf0;
    }

    .fabric-status {
      margin: 0;
      color: #788274;
      font-size: 11px;
      line-height: 1.6;
    }

    .download {
      display: block;
      padding: 10px 12px;
      border-radius: 12px;
      color: #fffaf3;
      background: var(--vermilion);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    .garden {
      position: relative;
      min-height: max(560px, min(76vh, 760px));
      overflow: hidden;
      background: var(--paper);
      isolation: isolate;
    }

    .leaf-canvas {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .garden.leaf-mode .leaf-canvas {
      pointer-events: auto;
      cursor: crosshair;
      touch-action: none;
    }

    .leaf-canvas[hidden] { display: none; }

    .leaf-guide {
      position: absolute;
      z-index: 5;
      display: none;
      width: 18px;
      height: 18px;
      border: 1px solid rgba(125, 150, 100, .55);
      border-radius: 50%;
      background: rgba(235, 242, 219, .82);
      box-shadow: 0 0 18px 7px rgba(189, 210, 149, .58);
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: breathe 2.4s ease-in-out infinite;
    }

    .garden.leaf-mode .leaf-guide { display: block; }

    .garden::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      background-image: radial-gradient(rgba(132, 92, 63, .1) .55px, transparent .55px);
      background-size: 17px 17px;
      content: "";
      opacity: .18;
      pointer-events: none;
    }

    .garden-note {
      position: absolute;
      top: 21px;
      left: 23px;
      z-index: 1;
      color: #8d5c4c;
      font-family: Georgia, "Noto Serif TC", serif;
      font-size: 12px;
      letter-spacing: .12em;
      pointer-events: none;
    }

    .garden-note span {
      display: block;
      margin-top: 4px;
      color: #a1816a;
      font-family: "Avenir Next", Avenir, "Noto Sans TC", sans-serif;
      font-size: 10px;
      letter-spacing: .08em;
    }

    .leaf-decoration {
      position: absolute;
      z-index: -1;
      color: rgba(169, 54, 43, .1);
      font-family: "Noto Serif TC", "Songti TC", serif;
      font-size: 82px;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .leaf-one { right: 16px; bottom: 12px; transform: rotate(-15deg); }
    .leaf-two { top: 54px; right: 40px; transform: rotate(8deg) scale(.58); }

    .target {
      position: absolute;
      z-index: 5;
      display: grid;
      width: 104px;
      height: 104px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: crosshair;
      transform: translate(-50%, -50%);
      -webkit-tap-highlight-color: transparent;
    }

    .target:focus-visible {
      outline: 2px solid #60845a;
      outline-offset: 3px;
    }

    .target-glow {
      position: absolute;
      inset: 12px;
      border: 1px dashed rgba(125, 150, 100, .48);
      border-radius: 50%;
      background: rgba(228, 236, 208, .48);
      box-shadow: 0 0 14px 5px rgba(189, 210, 149, .4);
      animation: breathe 2.4s ease-in-out infinite;
      transition: opacity .25s ease, transform .25s ease;
    }

    .target-glow::after {
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(137, 159, 108, .35);
      border-radius: 50%;
      content: "";
    }

    .target-progress {
      position: absolute;
      z-index: 1;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(var(--gold) calc(var(--progress, 0) * 1%), transparent 0);
      opacity: .9;
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      pointer-events: none;
    }

    .target-stamp {
      position: relative;
      z-index: 2;
      display: grid;
      width: 92px;
      height: 92px;
      place-items: center;
      border: 0;
      background: transparent;
      box-shadow: none;
      opacity: .38;
      transform: scale(.7);
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
    }

    .stamp-image {
      display: block;
      width: var(--stamp-size, 82px);
      height: var(--stamp-size, 82px);
      object-fit: contain;
    }

    .target:not(.stamped):hover .target-glow,
    .target:not(.stamped):focus-visible .target-glow {
      transform: scale(1.12);
    }

    .target.stamped { cursor: default; }

    .target.stamped .target-glow {
      border-color: rgba(108, 132, 87, .15);
      background: rgba(221, 231, 199, .17);
      box-shadow: none;
      animation: none;
      opacity: .55;
    }

    .target.stamped .target-progress { display: none; }

    .target.stamped .target-stamp {
      border: 0;
      background: transparent;
      box-shadow: none;
      opacity: 1;
      filter: saturate(1.2) contrast(1.04);
      transform: scale(1) rotate(-12deg);
      animation: stamp-in .42s cubic-bezier(.2, 1.6, .35, 1) both;
    }

    .target.stamped:nth-of-type(even) .target-stamp { transform: scale(1) rotate(10deg); }
    .target.stamped .stamp-image {
      width: var(--stamp-size, 82px);
      height: var(--stamp-size, 82px);
    }

    .complete-message {
      position: absolute;
      right: 20px;
      bottom: 17px;
      left: 20px;
      z-index: 2;
      color: #52724e;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
    }

    .garden.complete .complete-message { opacity: 1; transform: translateY(0); }

    .footer-note {
      margin: 17px 0 0;
      color: #929687;
      font-size: 11px;
      text-align: center;
      letter-spacing: .04em;
    }

    @keyframes breathe {
      0%, 100% { opacity: .65; transform: scale(.94); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes stamp-in {
      0% { opacity: 0; transform: scale(1.65) rotate(-18deg); }
      70% { opacity: 1; transform: scale(.88) rotate(5deg); }
      100% { opacity: 1; transform: scale(1) rotate(-8deg); }
    }

    @media (max-width: 760px) {
      .page { width: min(600px, calc(100% - 28px)); padding-top: 18px; }
      .topbar { margin-bottom: 27px; }
      .game-card { grid-template-columns: 1fr; gap: 10px; padding: 14px; }
      .sidebar { padding: 8px 3px 0; }
      .pattern-list { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
      .pattern-option { min-height: 74px; border-radius: 10px; }
      .pattern-preview { width: 38px; height: 38px; }
      .pattern-name { font-size: 10px; }
      .instruction { margin-top: 12px; padding: 9px 12px; }
      .progress-card { padding-top: 10px; }
      .reset { margin-top: 5px; }
      .fabric-output { max-width: 280px; margin: 14px auto 0; }
      .garden { min-height: max(480px, min(72vh, 680px)); }
      .target { width: 84px; height: 84px; }
      .target-stamp { width: 74px; height: 74px; }
      .stamp-image, .target.stamped .stamp-image {
        width: var(--stamp-size, 64px);
        height: var(--stamp-size, 64px);
      }
    }

    @media (max-width: 430px) {
      .page { width: calc(100% - 20px); }
      .game-card { padding: 10px; }
      .pattern-list { gap: 4px; }
      .pattern-option { min-height: 66px; padding: 5px 2px; }
      .pattern-preview { width: 34px; height: 34px; }
      .pattern-name { font-size: 9px; }
      .garden { min-height: max(420px, min(72vh, 620px)); }
      .garden-note { top: 15px; left: 16px; }
      .target { width: 74px; height: 74px; }
      .target-stamp { width: 66px; height: 66px; }
      .stamp-image, .target.stamped .stamp-image {
        width: var(--stamp-size, 58px);
        height: var(--stamp-size, 58px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">印</span><span>紙上花園</span></div>
      <span class="season-tag">花鳥小集 · 春</span>
    </header>

    <section class="intro" aria-labelledby="game-title">
      <p class="eyebrow">A LITTLE GARDEN OF SEALS</p>
      <h1 id="game-title">花鳥蓋印所</h1>
      <p class="subtitle">依序用筆刷畫葉、蓋下 5 朵花，再蓋 2 隻小鳥，織成專屬花布。</p>
    </section>

    <section class="game-card" aria-label="花鳥蓋印遊戲">
      <aside class="sidebar">
        <h2 class="section-label" id="stage-heading">01　用葉片筆刷自由描畫</h2>
        <div class="pattern-list" role="group" aria-label="選擇蓋印圖樣">
          <button class="pattern-option" type="button" data-kind="flower" data-image="crocus-1279508_1280.webp" data-name="紫花" aria-pressed="false" aria-label="選擇紫花圖樣">
            <img class="pattern-preview" src="crocus-1279508_1280.webp" alt=""><span class="pattern-name">紫花</span>
          </button>
          <button class="pattern-option" type="button" data-kind="leaf" data-image="9ae5cb84d561e853cb062901367e86f4.png" data-name="青葉" aria-pressed="false" aria-label="選擇青葉圖樣">
            <img class="pattern-preview" src="9ae5cb84d561e853cb062901367e86f4.png" alt=""><span class="pattern-name">青葉</span>
          </button>
          <button class="pattern-option" type="button" data-kind="bird" data-image="pngtree-small-cute-bird-png-image_9959508.png" data-name="雀鳥" aria-pressed="false" aria-label="選擇雀鳥圖樣">
            <img class="pattern-preview" src="pngtree-small-cute-bird-png-image_9959508.png" alt=""><span class="pattern-name">雀鳥</span>
          </button>
          <button class="pattern-option" type="button" data-kind="flower" data-image="pngtree-mugunghwa-pink-flower-of-korea-png-png-image_11494956.png" data-name="木槿" aria-pressed="false" aria-label="選擇木槿圖樣">
            <img class="pattern-preview" src="pngtree-mugunghwa-pink-flower-of-korea-png-png-image_11494956.png" alt=""><span class="pattern-name">木槿</span>
          </button>
        </div>

        <p class="instruction" id="stage-instruction">選擇葉片後，在白紙上移動滑鼠自由描畫。完成後按 OK 前往下一步。</p>
        <p class="game-status" id="game-status" role="status">先選一款葉片圖樣，再在紙上描畫。</p>
        <button class="finish-leaves" id="finish-leaves" type="button" disabled hidden>OK，完成葉片並進入花朵</button>

        <div class="progress-card" aria-live="polite">
          <span class="progress-label" id="progress-label">花朵</span>
          <span class="progress-count"><span id="stamped-count">0</span><small id="stage-total"> / 5</small></span>
        </div>
        <button class="reset" id="reset-game" type="button">↻　重新開始</button>
        <section class="fabric-output" id="fabric-output" aria-label="花布 JPG" hidden>
          <img class="fabric-preview" id="fabric-preview" alt="依蓋印圖樣生成的重複花布預覽">
          <p class="fabric-status" id="fabric-status" role="status">正在生成花布圖樣……</p>
          <a class="download" id="fabric-download" download="花鳥重複花布.jpg" hidden>下載花布 JPG</a>
          <button class="reset" id="generate-fabric" type="button">重新生成花布</button>
        </section>
      </aside>

      <div class="garden" id="garden" aria-label="花鳥印箋；花鳥停留一秒蓋印，葉片階段可用滑鼠自由描畫">
        <div class="garden-note">花鳥印箋<span>循序蓋印：葉筆刷、花五朵、鳥兩隻</span></div>
        <span class="leaf-decoration leaf-one" aria-hidden="true">印</span>
        <span class="leaf-decoration leaf-two" aria-hidden="true">花</span>
        <canvas class="leaf-canvas" id="leaf-canvas" aria-label="自由繪製葉片的畫紙區" hidden></canvas>
        <span class="leaf-guide" style="left:19%;top:32%" aria-hidden="true"></span>
        <span class="leaf-guide" style="left:42%;top:26%" aria-hidden="true"></span>
        <span class="leaf-guide" style="left:70%;top:35%" aria-hidden="true"></span>
        <span class="leaf-guide" style="left:31%;top:67%" aria-hidden="true"></span>
        <span class="leaf-guide" style="left:79%;top:70%" aria-hidden="true"></span>
        <button class="target" type="button" data-stage="flower" style="left:19%;top:28%" aria-label="尚未蓋印的花朵位置一">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <button class="target" type="button" data-stage="flower" style="left:45%;top:22%" aria-label="尚未蓋印的花朵位置二">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <button class="target" type="button" data-stage="flower" style="left:72%;top:29%" aria-label="尚未蓋印的花朵位置三">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <button class="target" type="button" data-stage="flower" style="left:83%;top:50%" aria-label="尚未蓋印的花朵位置四">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <button class="target" type="button" data-stage="flower" style="left:30%;top:58%" aria-label="尚未蓋印的花朵位置五">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <button class="target" type="button" data-stage="bird" style="left:32%;top:43%" aria-label="尚未蓋印的小鳥位置一">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <button class="target" type="button" data-stage="bird" style="left:74%;top:58%" aria-label="尚未蓋印的小鳥位置二">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <div class="complete-message" role="status">花鳥印譜完成，花布已織成！</div>
      </div>
    </section>
    <p class="footer-note">以花為箋，以鳥為印，慢慢留住一方春意。</p>
  </main>

  <script>
    const patternButtons = [...document.querySelectorAll(".pattern-option")];
    const targets = [...document.querySelectorAll(".target")];
    const patternList = document.querySelector(".pattern-list");
    const countLabel = document.getElementById("stamped-count");
    const stageTotal = document.getElementById("stage-total");
    const stageHeading = document.getElementById("stage-heading");
    const stageInstruction = document.getElementById("stage-instruction");
    const progressLabel = document.getElementById("progress-label");
    const gameStatus = document.getElementById("game-status");
    const garden = document.getElementById("garden");
    const resetButton = document.getElementById("reset-game");
    const leafCanvas = document.getElementById("leaf-canvas");
    const leafBrushContext = leafCanvas.getContext("2d");
    const finishLeavesButton = document.getElementById("finish-leaves");
    const fabricOutput = document.getElementById("fabric-output");
    const fabricPreview = document.getElementById("fabric-preview");
    const fabricStatus = document.getElementById("fabric-status");
    const fabricDownload = document.getElementById("fabric-download");
    const generateFabricButton = document.getElementById("generate-fabric");
    const stages = [
      { key: "leaf", kind: "leaf", name: "葉片", heading: "01　用葉片筆刷自由描畫", count: null },
      { key: "flower", kind: "flower", name: "花朵", heading: "02　選一款花樣，再蓋 5 朵花", count: 5 },
      { key: "bird", kind: "bird", name: "小鳥", heading: "03　選一款鳥樣，再蓋 2 隻小鳥", count: 2 }
    ];
    let stageIndex = 0;
    let selectedPattern = null;
    let patternLocked = false;
    let leafMarks = [];
    let lastBrushPoint = null;
    let brushDistance = 0;
    let lastBrushSize = 0;
    let nextLeafBrushSize = null;
    const minLeafBrushSize = 100;
    const maxLeafBrushSize = 200;
    const leafBrushGap = 5;
    const artImageCache = new Map();
    const loadedArtImages = new Map();
    let fabricObjectUrl = null;
    let fabricGeneration = 0;

    function updateStageView() {
      const stage = stages[stageIndex];
      const complete = !stage;

      patternList.hidden = complete;
      fabricOutput.hidden = !complete;
      finishLeavesButton.hidden = stage?.key !== "leaf";
      finishLeavesButton.disabled = stage?.key !== "leaf" || leafMarks.length === 0;
      leafCanvas.hidden = leafMarks.length === 0 && stage?.key !== "leaf";
      garden.classList.toggle("leaf-mode", stage?.key === "leaf");
      if (stage?.key === "leaf") resizeLeafCanvas();
      patternButtons.forEach((button) => {
        button.hidden = complete || button.dataset.kind !== stage.kind;
        button.disabled = complete || (patternLocked && stage.kind !== "leaf");
        button.setAttribute("aria-pressed", String(selectedPattern?.image === button.dataset.image));
      });

      targets.forEach((target) => {
        const targetStage = stages.findIndex((item) => item.key === target.dataset.stage);
        target.hidden = !complete && targetStage > stageIndex;
      });

      if (complete) {
        stageHeading.textContent = "04　花布完成";
        progressLabel.textContent = "全部印記";
        countLabel.textContent = String(7 + leafMarks.length);
        stageTotal.textContent = " 枚印記";
        stageInstruction.textContent = "花朵、葉片筆刷與小鳥都完成了，正在把你的圖樣排成花布。";
        return;
      }

      const stampedInStage = targets.filter((target) =>
        target.dataset.stage === stage.key && target.classList.contains("stamped")
      ).length;
      stageHeading.textContent = stage.heading;
      progressLabel.textContent = stage.name;
      countLabel.textContent = String(stage.key === "leaf" ? leafMarks.length : stampedInStage);
      stageTotal.textContent = stage.count === null ? " 片已畫" : ` / ${stage.count}`;
      if (stage.key === "leaf") {
        stageInstruction.innerHTML = `選擇葉片後，在白紙上移動滑鼠自由描畫；葉片大小隨機為 ${minLeafBrushSize}–${maxLeafBrushSize}px，葉與葉間距 <strong>${leafBrushGap}px</strong>。完成後按 OK 前往下一步。`;
        return;
      }
      stageInstruction.innerHTML = selectedPattern
        ? `將滑鼠停在紙上的光點 <strong>1 秒</strong>蓋印；每枚印記大小略有不同。`
        : "先選一款圖樣，再將滑鼠停在紙上的光點 <strong>1 秒</strong>蓋印；印記大小略有不同。";
    }

    patternButtons.forEach((button) => {
      button.addEventListener("click", async () => {
        if (button.disabled) return;
        selectedPattern = {
          image: button.dataset.image,
          name: button.dataset.name
        };
        updateStageView();
        const chosenPattern = selectedPattern;
        gameStatus.textContent = `正在準備「${chosenPattern.name}」圖樣……`;
        try {
          await loadArtImage(chosenPattern.image);
          if (selectedPattern !== chosenPattern) return;
          gameStatus.textContent = stages[stageIndex]?.key === "leaf"
            ? `已選「${chosenPattern.name}」葉片；在白紙上移動滑鼠即可繪畫。`
            : `已選「${chosenPattern.name}」，把滑鼠移到紙上的光點停留 1 秒。`;
        } catch (error) {
          if (selectedPattern === chosenPattern) gameStatus.textContent = `圖樣載入失敗：${error.message}`;
        }
      });
    });

    function getDisplayStampSize(printSize) {
      return printSize * garden.getBoundingClientRect().width / 4500;
    }

    function resizeVisibleStamps() {
      targets.forEach((target) => {
        if (target.dataset.printSize) {
          target.style.setProperty("--stamp-size", `${getDisplayStampSize(Number(target.dataset.printSize))}px`);
        }
      });
    }

    window.addEventListener("resize", () => {
      resizeLeafCanvas();
      resizeVisibleStamps();
    });

    function resizeLeafCanvas() {
      const bounds = garden.getBoundingClientRect();
      const pixelRatio = window.devicePixelRatio || 1;
      leafCanvas.width = Math.round(bounds.width * pixelRatio);
      leafCanvas.height = Math.round(bounds.height * pixelRatio);
      leafBrushContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      leafBrushContext.clearRect(0, 0, bounds.width, bounds.height);
      leafMarks.forEach((mark) => drawLeafMark(mark));
    }

    function drawLeafMark(mark) {
      const image = loadedArtImages.get(mark.image);
      if (!image || !leafBrushContext) return;
      const bounds = garden.getBoundingClientRect();
      const halfSize = mark.size / 2;
      leafBrushContext.save();
      leafBrushContext.translate(mark.x * bounds.width, mark.y * bounds.height);
      leafBrushContext.rotate(mark.angle);
      leafBrushContext.drawImage(image, -halfSize, -halfSize, mark.size, mark.size);
      leafBrushContext.restore();
    }

    function randomLeafBrushSize() {
      return minLeafBrushSize + Math.floor(Math.random() * (maxLeafBrushSize - minLeafBrushSize + 1));
    }

    function addLeafMark(x, y, angle, size) {
      if (!selectedPattern || !loadedArtImages.has(selectedPattern.image)) return null;
      const bounds = garden.getBoundingClientRect();
      const mark = {
        x: x / bounds.width,
        y: y / bounds.height,
        angle,
        size,
        image: selectedPattern.image
      };
      leafMarks.push(mark);
      drawLeafMark(mark);
      countLabel.textContent = String(leafMarks.length);
      stageTotal.textContent = " 片已畫";
      finishLeavesButton.disabled = false;
      if (leafMarks.length === 1 || leafMarks.length % 20 === 0) {
        gameStatus.textContent = `葉片筆刷已畫 ${leafMarks.length} 片；完成後按 OK 前往花朵。`;
      }
      return mark;
    }

    function paintLeafAtPointer(event) {
      if (stages[stageIndex]?.key !== "leaf" || !selectedPattern || !loadedArtImages.has(selectedPattern.image)) return;
      const bounds = garden.getBoundingClientRect();
      const edgeMargin = maxLeafBrushSize / 2;
      const current = {
        x: Math.max(edgeMargin, Math.min(event.clientX - bounds.left, bounds.width - edgeMargin)),
        y: Math.max(edgeMargin, Math.min(event.clientY - bounds.top, bounds.height - edgeMargin))
      };
      if (!lastBrushPoint) {
        const mark = addLeafMark(current.x, current.y, Math.random() * Math.PI * 2, randomLeafBrushSize());
        lastBrushPoint = current;
        lastBrushSize = mark.size;
        nextLeafBrushSize = randomLeafBrushSize();
        brushDistance = 0;
        return;
      }

      const deltaX = current.x - lastBrushPoint.x;
      const deltaY = current.y - lastBrushPoint.y;
      const distance = Math.hypot(deltaX, deltaY);
      if (!distance) return;

      let travelled = 0;
      let nextStep = (lastBrushSize + nextLeafBrushSize) / 2 + leafBrushGap - brushDistance;
      while (distance - travelled >= nextStep) {
        travelled += nextStep;
        const progress = travelled / distance;
        const x = lastBrushPoint.x + deltaX * progress;
        const y = lastBrushPoint.y + deltaY * progress;
        const direction = Math.atan2(deltaY, deltaX) + (Math.random() - .5) * .34;
        const mark = addLeafMark(x, y, direction, nextLeafBrushSize);
        lastBrushSize = mark.size;
        nextLeafBrushSize = randomLeafBrushSize();
        nextStep = (lastBrushSize + nextLeafBrushSize) / 2 + leafBrushGap;
      }
      brushDistance = travelled ? distance - travelled : brushDistance + distance;
      lastBrushPoint = current;
    }

    garden.addEventListener("pointerenter", (event) => {
      lastBrushPoint = null;
      brushDistance = 0;
      lastBrushSize = 0;
      nextLeafBrushSize = null;
      paintLeafAtPointer(event);
    });
    garden.addEventListener("pointermove", paintLeafAtPointer);
    garden.addEventListener("pointerleave", () => {
      lastBrushPoint = null;
      brushDistance = 0;
      lastBrushSize = 0;
      nextLeafBrushSize = null;
    });
    function stopStamping(target) {
      if (target.stampFrame) {
        cancelAnimationFrame(target.stampFrame);
        target.stampFrame = null;
      }
      target.style.removeProperty("--progress");
    }

    function startStamping(target) {
      const stage = stages[stageIndex];
      if (target.hidden || target.disabled || target.classList.contains("stamped") || target.stampFrame) return;
      if (!stage || target.dataset.stage !== stage.key) return;
      if (!selectedPattern) {
        gameStatus.textContent = `先選擇${stage.name}圖樣，再開始蓋印。`;
        return;
      }
      const startedAt = performance.now();

      function updateProgress(now) {
        const progress = Math.min((now - startedAt) / 1000, 1);
        target.style.setProperty("--progress", String(progress * 100));
        if (progress === 1) {
          target.stampFrame = null;
          stamp(target);
          return;
        }
        target.stampFrame = requestAnimationFrame(updateProgress);
      }

      target.stampFrame = requestAnimationFrame(updateProgress);
    }

    function stamp(target) {
      const stage = stages[stageIndex];
      if (!stage || !selectedPattern || target.dataset.stage !== stage.key || target.classList.contains("stamped")) return;
      const stampIndex = targets.filter((item) =>
        item.dataset.stage === stage.key && item.classList.contains("stamped")
      ).length;
      target.classList.add("stamped");
      const stampImage = target.querySelector(".stamp-image");
      stampImage.src = selectedPattern.image;
      stampImage.alt = `${selectedPattern.name}圖樣`;
      const printSize = stage.key === "bird" ? 600 : stampIndex % 2 === 0 ? 300 : 600;
      target.dataset.printSize = String(printSize);
      target.style.setProperty("--stamp-size", `${getDisplayStampSize(printSize)}px`);
      target.dataset.image = selectedPattern.image;
      target.setAttribute("aria-label", `${stage.name}：${selectedPattern.name}圖樣，已蓋印`);
      target.setAttribute("aria-pressed", "true");
      target.disabled = true;
      target.style.removeProperty("--progress");
      patternLocked = true;

      if (stage.count === null) return;
      const stampedInStage = targets.filter((item) =>
        item.dataset.stage === stage.key && item.classList.contains("stamped")
      ).length;
      if (stampedInStage < stage.count) {
        updateStageView();
        gameStatus.textContent = `已蓋 ${stampedInStage} / ${stage.count}；本階段圖樣已選定，繼續尋找光點。`;
        return;
      }

      stageIndex += 1;
      selectedPattern = null;
      patternLocked = false;
      updateStageView();
      if (stageIndex === stages.length) {
        garden.classList.add("complete");
        gameStatus.textContent = "花、葉與小鳥都完成了，正在本機生成重複花布 JPG。";
        generateAndShowFabric();
      } else {
        gameStatus.textContent = `${stage.name}完成！接著選擇${stages[stageIndex].name}圖樣。`;
      }
    }

    targets.forEach((target) => {
      target.addEventListener("pointerenter", () => startStamping(target));
      target.addEventListener("pointerleave", () => {
        if (!target.classList.contains("stamped")) stopStamping(target);
      });
      target.addEventListener("focus", () => startStamping(target));
      target.addEventListener("blur", () => {
        if (!target.classList.contains("stamped")) stopStamping(target);
      });
    });

    finishLeavesButton.addEventListener("click", () => {
      if (stages[stageIndex]?.key !== "leaf" || leafMarks.length === 0) return;
      stageIndex += 1;
      selectedPattern = null;
      patternLocked = false;
      lastBrushPoint = null;
      brushDistance = 0;
      lastBrushSize = 0;
      nextLeafBrushSize = null;
      updateStageView();
      gameStatus.textContent = `葉片完成，共畫了 ${leafMarks.length} 片；接著選一款花樣。`;
    });

    function loadArtImage(src) {
      if (artImageCache.has(src)) return artImageCache.get(src);
      const imagePromise = new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => {
          loadedArtImages.set(src, image);
          resolve(image);
        };
        image.onerror = () => reject(new Error(`無法載入圖樣：${src}`));
        image.src = src;
      });
      artImageCache.set(src, imagePromise);
      imagePromise.catch(() => artImageCache.delete(src));
      return imagePromise;
    }

    async function createFabricJpg() {
      const imagesByStage = Object.fromEntries(stages.map((stage) => [
        stage.key,
        stage.key === "leaf"
          ? [...new Set(leafMarks.map((mark) => mark.image))]
          : targets
            .filter((target) => target.dataset.stage === stage.key && target.dataset.image)
            .map((target) => ({
              src: target.dataset.image,
              size: Number(target.dataset.printSize)
            }))
      ]));
      if (stages.some((stage) => imagesByStage[stage.key].length === 0) || leafMarks.length === 0) {
        throw new Error("缺少花、葉或小鳥印樣，請重新完成蓋印流程。");
      }

      const sources = [...new Set(Object.values(imagesByStage).flat().map((entry) =>
        typeof entry === "string" ? entry : entry.src
      ))];
      const loadedImages = new Map(await Promise.all(sources.map(async (src) => [src, await loadArtImage(src)])));
      const tile = document.createElement("canvas");
      tile.width = 4500;
      tile.height = 4500;
      const tileContext = tile.getContext("2d");
      if (!tileContext) throw new Error("無法建立花布圖樣畫布。");

      tileContext.fillStyle = "#fffaf0";
      tileContext.fillRect(0, 0, tile.width, tile.height);
      tileContext.imageSmoothingEnabled = true;
      tileContext.imageSmoothingQuality = "high";
      const layoutSize = 6;
      const layout = Array.from({ length: layoutSize }, (_, rowIndex) =>
        Array.from({ length: layoutSize }, (_, columnIndex) =>
          (rowIndex + columnIndex) % layoutSize === 0 ? "bird" : "flower"
        )
      );
      const cellSize = tile.width / layoutSize;

      leafMarks.forEach((mark) => {
        const image = loadedImages.get(mark.image);
        const x = mark.x * tile.width;
        const y = mark.y * tile.height;
        const halfSize = mark.size / 2;
        const xOffsets = [0];
        const yOffsets = [0];
        if (x < halfSize) xOffsets.push(tile.width);
        if (x > tile.width - halfSize) xOffsets.push(-tile.width);
        if (y < halfSize) yOffsets.push(tile.height);
        if (y > tile.height - halfSize) yOffsets.push(-tile.height);
        xOffsets.forEach((offsetX) => yOffsets.forEach((offsetY) => {
          tileContext.save();
          tileContext.translate(x + offsetX, y + offsetY);
          tileContext.rotate(mark.angle);
          tileContext.drawImage(image, -halfSize, -halfSize, mark.size, mark.size);
          tileContext.restore();
        }));
      });

      layout.forEach((row, rowIndex) => {
        row.forEach((kind, columnIndex) => {
          if (!kind) return;
          const choices = imagesByStage[kind];
          const choice = choices[(rowIndex * layoutSize + columnIndex) % choices.length];
          const image = loadedImages.get(choice.src);
          const centerX = columnIndex * cellSize + cellSize / 2;
          const centerY = rowIndex * cellSize + cellSize / 2;
          const scale = Math.min(choice.size / image.naturalWidth, choice.size / image.naturalHeight);
          const width = image.naturalWidth * scale;
          const height = image.naturalHeight * scale;
          const rotation = kind === "bird" ? 0 : (Math.random() - .5) * .16;

          tileContext.save();
          tileContext.translate(centerX, centerY);
          tileContext.rotate(rotation);
          tileContext.drawImage(image, -width / 2, -height / 2, width, height);
          tileContext.restore();
        });
      });

      return new Promise((resolve, reject) => {
        tile.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error("瀏覽器無法輸出 JPG。"));
        }, "image/jpeg", .94);
      });
    }

    async function generateAndShowFabric() {
      const generation = ++fabricGeneration;
      generateFabricButton.disabled = true;
      fabricStatus.textContent = "正在本機排列花、葉與小鳥圖樣……";
      try {
        const blob = await createFabricJpg();
        if (generation !== fabricGeneration) return;
        if (fabricObjectUrl) URL.revokeObjectURL(fabricObjectUrl);
        fabricObjectUrl = URL.createObjectURL(blob);
        fabricPreview.src = fabricObjectUrl;
        fabricDownload.href = fabricObjectUrl;
        fabricDownload.hidden = false;
        fabricStatus.textContent = "重複花布 JPG 已生成（4500 × 4500）；花為 300 或 600px、小鳥 600px，包含 30 朵花與 6 隻鳥，葉片大小隨機為 100–200px，可下載保存。";
      } catch (error) {
        if (generation === fabricGeneration) fabricStatus.textContent = `花布生成失敗：${error.message}`;
      } finally {
        if (generation === fabricGeneration) generateFabricButton.disabled = false;
      }
    }

    generateFabricButton.addEventListener("click", generateAndShowFabric);

    resetButton.addEventListener("click", () => {
      fabricGeneration += 1;
      generateFabricButton.disabled = false;
      targets.forEach((target) => {
        if (target.stampFrame) cancelAnimationFrame(target.stampFrame);
        target.stampFrame = null;
        target.classList.remove("stamped");
        const stampImage = target.querySelector(".stamp-image");
        stampImage.removeAttribute("src");
        stampImage.alt = "";
        delete target.dataset.image;
        target.setAttribute("aria-label", `尚未蓋印的位置${targets.indexOf(target) + 1}`);
        target.removeAttribute("aria-pressed");
        target.disabled = false;
        target.style.removeProperty("--progress");
        target.style.removeProperty("--stamp-size");
        delete target.dataset.printSize;
      });
      stageIndex = 0;
      selectedPattern = null;
      patternLocked = false;
      if (fabricObjectUrl) URL.revokeObjectURL(fabricObjectUrl);
      fabricObjectUrl = null;
      fabricPreview.removeAttribute("src");
      fabricDownload.removeAttribute("href");
      fabricDownload.hidden = true;
      leafMarks = [];
      lastBrushPoint = null;
      brushDistance = 0;
      lastBrushSize = 0;
      nextLeafBrushSize = null;
      resizeLeafCanvas();
      fabricStatus.textContent = "完成蓋印後，會在此生成花布 JPG。";
      gameStatus.textContent = "選好花樣就開始蓋印。";
      garden.classList.remove("complete");
      updateStageView();
    });

    updateStageView();
  </script>
</body>
</html>
