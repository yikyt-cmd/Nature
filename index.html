<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5e9">
  <title>花蝶蓋印</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Avenir Next", Avenir, "Noto Sans TC", "PingFang TC", sans-serif;
      color: #293d31;
      background: #f8f5e9;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --leaf: #64845c;
      --deep-leaf: #37563f;
      --paper: #ffffff;
      --muted: #788274;
      --vermilion: #a9362b;
      --gold: #bd9652;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 8% 8%, rgba(223, 229, 197, .58), transparent 34rem),
        radial-gradient(ellipse at 92% 88%, rgba(239, 218, 180, .38), transparent 33rem),
        #f8f5e9;
    }

    button { font: inherit; }

    .page {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
    }

    .game-card {
      width: 100%;
      height: 100%;
    }

    .sidebar {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      display: grid;
      width: min(390px, calc(100% - 24px));
      max-height: calc(100% - 24px);
      gap: 8px;
      overflow: auto;
      padding: 12px;
      border: 1px solid rgba(115, 93, 72, .2);
      border-radius: 14px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 5px 24px rgba(67, 55, 40, .12);
      backdrop-filter: blur(8px);
    }

    .sidebar.collapsed {
      width: auto;
      max-width: calc(100% - 24px);
      gap: 0;
      padding: 8px;
      overflow: visible;
    }

    .sidebar.collapsed .pattern-list,
    .sidebar.collapsed .instruction,
    .sidebar.collapsed .game-status,
    .sidebar.collapsed .fabric-output { display: none; }

    .section-label {
      margin: 0;
      color: #405944;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .control-head { display: flex; align-items: center; gap: 10px; }
    .control-toggle { white-space: nowrap; }

    .pattern-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .pattern-option {
      display: flex;
      min-height: 64px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 4px;
      border: 1px solid #e8ded1;
      border-radius: 12px;
      color: #596653;
      background: #fffdfa;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .pattern-option:hover { transform: translateY(-2px); }

    .pattern-option[aria-pressed="true"] {
      border-color: var(--vermilion);
      background: #fff8f1;
      box-shadow: 0 0 0 2px rgba(169, 54, 43, .1);
    }

    .pattern-option:disabled { cursor: default; opacity: .72; }
    .pattern-list[hidden], .pattern-option[hidden], .target[hidden], .fabric-output[hidden], .download[hidden] { display: none; }

    .pattern-preview {
      width: 36px;
      height: 36px;
      border: 1px solid #e8d6c6;
      border-radius: 50%;
      background: #fff;
      object-fit: cover;
    }

    .pattern-name { color: #685344; font-size: 10px; font-weight: 700; }

    .instruction {
      margin: 0;
      color: #64715e;
      font-size: 12px;
      line-height: 1.4;
    }

    .instruction strong { color: #405944; }

    .game-status {
      min-height: 0;
      margin: 0;
      color: #8b5c4c;
      font-size: 11px;
      line-height: 1.4;
    }

    .progress-card {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      padding: 0;
    }

    .progress-label {
      color: #7b8476;
      font-size: 11px;
    }

    .progress-count {
      color: #476448;
      font-family: Georgia, serif;
      font-size: 17px;
      font-weight: 700;
    }

    .progress-count small {
      color: #9aa091;
      font-family: inherit;
      font-size: 11px;
      font-weight: 400;
    }

    .reset {
      width: auto;
      margin: 0;
      padding: 6px 10px;
      border: 1px solid #dfe3d3;
      border-radius: 9px;
      color: #65745f;
      background: #fff;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      transition: background .18s ease;
    }

    .reset:hover { background: #f2f3e9; }

    .finish-leaves {
      justify-self: start;
      width: auto;
      margin: 0;
      padding: 7px 14px;
      border: 0;
      border-radius: 9px;
      color: #fffaf3;
      background: var(--vermilion);
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
    }

    .finish-leaves:hover { background: #8f2d25; }
    .finish-leaves:disabled { cursor: not-allowed; opacity: .48; }
    .finish-leaves[hidden] { display: none; }

    .fabric-output {
      display: grid;
      gap: 7px;
      margin: 0;
      text-align: center;
    }

    .fabric-preview-dialog {
      width: min(94vw, 1100px);
      max-width: none;
      height: min(92dvh, 1000px);
      max-height: none;
      padding: 14px;
      border: 1px solid rgba(115, 93, 72, .24);
      border-radius: 16px;
      color: #293d31;
      background: #fff;
      box-shadow: 0 16px 70px rgba(34, 25, 18, .35);
    }

    .fabric-preview-dialog::backdrop { background: rgba(31, 27, 24, .72); }

    .fabric-preview-content {
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 10px;
    }

    .fabric-preview-header, .fabric-preview-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .fabric-preview-header h2 {
      margin: 0;
      font-size: 16px;
    }

    .fabric-preview {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 1px solid #e8ded1;
      object-fit: contain;
      background: #a71922;
    }

    .fabric-preview-actions .download {
      width: fit-content;
      min-width: 120px;
    }

    .fabric-status {
      margin: 0;
      color: #788274;
      font-size: 11px;
      line-height: 1.4;
    }

    .fabric-ai-settings {
      display: grid;
      gap: 6px;
      text-align: left;
    }

    .fabric-ai-settings summary {
      color: #65745f;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .fabric-ai-settings label {
      color: #65745f;
      font-size: 11px;
      font-weight: 700;
    }

    .fabric-ai-settings input {
      width: 100%;
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid #dfe3d3;
      border-radius: 9px;
      color: #293d31;
      background: #fffefa;
      font: inherit;
      font-size: 11px;
    }

    .fabric-ai-settings small {
      color: #788274;
      font-size: 10px;
      line-height: 1.5;
    }

    .download {
      display: block;
      padding: 8px 12px;
      border-radius: 9px;
      color: #fffaf3;
      background: var(--vermilion);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    .garden {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: var(--paper);
      isolation: isolate;
    }

    .leaf-canvas {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .garden.leaf-mode .leaf-canvas {
      pointer-events: auto;
      cursor: crosshair;
      touch-action: none;
    }

    .leaf-canvas[hidden] { display: none; }

    .leaf-guide {
      position: absolute;
      z-index: 5;
      display: none;
      width: 24px;
      height: 24px;
      border: 3px solid #b52e28;
      border-radius: 50%;
      background: rgba(200, 59, 50, .2);
      box-shadow: 0 0 0 3px rgba(181, 46, 40, .12), 0 0 22px 9px rgba(181, 46, 40, .48);
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: breathe 2.4s ease-in-out infinite;
    }

    .garden.leaf-mode .leaf-guide { display: block; }

    .garden::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      background-image: radial-gradient(rgba(132, 92, 63, .1) .55px, transparent .55px);
      background-size: 17px 17px;
      content: "";
      opacity: .18;
      pointer-events: none;
    }

    .target {
      position: absolute;
      z-index: 5;
      display: grid;
      width: 104px;
      height: 104px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: crosshair;
      transform: translate(-50%, -50%);
      -webkit-tap-highlight-color: transparent;
    }

    .target:focus-visible {
      outline: 2px solid #60845a;
      outline-offset: 3px;
    }

    .target-glow {
      position: absolute;
      inset: 9px;
      border: 3px solid #b52e28;
      border-radius: 50%;
      background: rgba(200, 59, 50, .16);
      box-shadow: 0 0 0 3px rgba(181, 46, 40, .1), 0 0 20px 8px rgba(181, 46, 40, .44);
      animation: breathe 2.4s ease-in-out infinite;
      transition: opacity .25s ease, transform .25s ease;
    }

    .target-glow::after {
      position: absolute;
      inset: 9px;
      border: 2px solid rgba(181, 46, 40, .68);
      border-radius: 50%;
      content: "";
    }

    .target-progress {
      position: absolute;
      z-index: 1;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(#b52e28 calc(var(--progress, 0) * 1%), transparent 0);
      opacity: .9;
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
      pointer-events: none;
    }

    .target-stamp {
      position: relative;
      z-index: 2;
      display: grid;
      width: 92px;
      height: 92px;
      place-items: center;
      border: 0;
      background: transparent;
      box-shadow: none;
      opacity: .38;
      transform: scale(.7);
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
    }

    .stamp-image {
      display: block;
      width: var(--stamp-size, 82px);
      height: var(--stamp-size, 82px);
      object-fit: contain;
    }

    .target:not(.stamped):hover .target-glow,
    .target:not(.stamped):focus-visible .target-glow {
      transform: scale(1.12);
    }

    .target.stamped { cursor: default; }

    .target.stamped .target-glow {
      border-color: rgba(108, 132, 87, .15);
      background: rgba(221, 231, 199, .17);
      box-shadow: none;
      animation: none;
      opacity: .55;
    }

    .target.stamped .target-progress { display: none; }

    .target.stamped .target-stamp {
      border: 0;
      background: transparent;
      box-shadow: none;
      opacity: 1;
      filter: saturate(1.2) contrast(1.04);
      transform: scale(1) rotate(-12deg);
      animation: stamp-in .42s cubic-bezier(.2, 1.6, .35, 1) both;
    }

    .target.stamped:nth-of-type(even) .target-stamp { transform: scale(1) rotate(10deg); }
    .target.stamped .stamp-image {
      width: var(--stamp-size, 82px);
      height: var(--stamp-size, 82px);
    }

    .complete-message {
      position: absolute;
      right: 20px;
      bottom: 17px;
      left: 20px;
      z-index: 2;
      color: #52724e;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
    }

    .garden.complete .complete-message { opacity: 1; transform: translateY(0); }

    @keyframes breathe {
      0%, 100% { opacity: .65; transform: scale(.94); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes stamp-in {
      0% { opacity: 0; transform: scale(1.65) rotate(-18deg); }
      70% { opacity: 1; transform: scale(.88) rotate(5deg); }
      100% { opacity: 1; transform: scale(1) rotate(-8deg); }
    }

    @media (max-width: 760px) {
      .sidebar { top: 8px; left: 8px; width: min(360px, calc(100% - 16px)); max-height: calc(100% - 16px); padding: 9px; gap: 6px; }
      .sidebar.collapsed { max-width: calc(100% - 16px); padding: 7px; }
      .control-head { gap: 7px; }
      .pattern-option { min-height: 56px; gap: 3px; }
      .pattern-preview { width: 32px; height: 32px; }
      .target { width: 84px; height: 84px; }
      .target-stamp { width: 74px; height: 74px; }
      .stamp-image, .target.stamped .stamp-image {
        width: var(--stamp-size, 64px);
        height: var(--stamp-size, 64px);
      }
    }

    @media (max-width: 430px) {
      .sidebar { width: min(340px, calc(100% - 16px)); }
      .sidebar.collapsed { width: auto; }
      .pattern-list { gap: 4px; }
      .pattern-option { min-height: 50px; padding: 4px 2px; }
      .pattern-preview { width: 28px; height: 28px; }
      .pattern-name { font-size: 9px; }
      .section-label { font-size: 14px; }
      .target { width: 74px; height: 74px; }
      .target-stamp { width: 66px; height: 66px; }
      .stamp-image, .target.stamped .stamp-image {
        width: var(--stamp-size, 58px);
        height: var(--stamp-size, 58px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="game-card" aria-label="花蝶蓋印">
      <div class="garden" id="garden" aria-label="畫紙">
        <aside class="sidebar collapsed" aria-label="操作">
          <div class="control-head">
            <h2 class="section-label" id="stage-heading">葉</h2>
            <div class="progress-card" aria-live="polite">
              <span class="progress-label" id="progress-label">進度</span>
              <span class="progress-count"><span id="stamped-count">0</span><small id="stage-total"> 片</small></span>
            </div>
            <button class="finish-leaves" id="finish-leaves" type="button" disabled hidden>完成</button>
            <button class="reset" id="reset-game" type="button">重來</button>
            <button class="reset control-toggle" id="toggle-controls" type="button" aria-controls="game-controls" aria-expanded="false">操作</button>
          </div>
          <div class="pattern-list" id="game-controls" role="group" aria-label="選圖">
            <button class="pattern-option" type="button" data-kind="flower" data-image="crocus-1279508_1280.webp" data-name="紫花" aria-pressed="false" aria-label="紫花">
              <img class="pattern-preview" src="crocus-1279508_1280.webp" alt=""><span class="pattern-name">紫花</span>
            </button>
            <button class="pattern-option" type="button" data-kind="leaf" data-image="9ae5cb84d561e853cb062901367e86f4.png" data-name="青葉" aria-pressed="false" aria-label="青葉">
              <img class="pattern-preview" src="9ae5cb84d561e853cb062901367e86f4.png" alt=""><span class="pattern-name">青葉</span>
            </button>
            <button class="pattern-option" type="button" data-kind="flower" data-image="pngtree-mugunghwa-pink-flower-of-korea-png-png-image_11494956.png" data-name="木槿" aria-pressed="false" aria-label="木槿">
              <img class="pattern-preview" src="pngtree-mugunghwa-pink-flower-of-korea-png-png-image_11494956.png" alt=""><span class="pattern-name">木槿</span>
            </button>
          </div>
          <p class="instruction" id="stage-instruction">選葉，拖畫；完成後按「完成」。</p>
          <p class="game-status" id="game-status" role="status">選一款葉片。</p>
          <section class="fabric-output" id="fabric-output" aria-label="花布" hidden>
            <p class="fabric-status" id="fabric-status" role="status">製作中…</p>
            <button class="reset" id="show-fabric-preview" type="button" hidden>預覽花布</button>
            <details class="fabric-ai-settings">
              <summary>AI 布底</summary>
              <label for="fabric-ai-endpoint">Worker 網址</label>
              <input id="fabric-ai-endpoint" type="url" inputmode="url" placeholder="https://…" autocomplete="url">
              <button class="reset" id="save-fabric-ai-endpoint" type="button">儲存</button>
              <small>畫紙圖樣留在本機；API 金鑰勿貼在此處。</small>
            </details>
            <button class="reset" id="generate-fabric" type="button">再生成</button>
          </section>
        </aside>
        <dialog class="fabric-preview-dialog" id="fabric-preview-dialog" aria-labelledby="fabric-preview-title">
          <div class="fabric-preview-content">
            <header class="fabric-preview-header">
              <h2 id="fabric-preview-title">花布預覽</h2>
              <button class="reset" id="close-fabric-preview" type="button">關閉</button>
            </header>
            <img class="fabric-preview" id="fabric-preview" alt="重複花布預覽">
            <div class="fabric-preview-actions">
              <span class="fabric-status" id="preview-fabric-status"></span>
              <a class="download" id="fabric-download" download="花鳥蝴蝶重複花布.jpg" hidden>下載 JPG</a>
            </div>
          </div>
        </dialog>
        <canvas class="leaf-canvas" id="leaf-canvas" aria-label="自由繪製葉片的畫紙區" hidden></canvas>
        <span class="leaf-guide" style="left:19%;top:40%" aria-hidden="true"></span>
        <span class="leaf-guide" style="left:42%;top:42%" aria-hidden="true"></span>
        <span class="leaf-guide" style="left:70%;top:40%" aria-hidden="true"></span>
        <span class="leaf-guide" style="left:31%;top:67%" aria-hidden="true"></span>
        <span class="leaf-guide" style="left:79%;top:70%" aria-hidden="true"></span>
        <button class="target" type="button" data-stage="flower" style="left:19%;top:40%" aria-label="花一">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <button class="target" type="button" data-stage="flower" style="left:45%;top:42%" aria-label="花二">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <button class="target" type="button" data-stage="flower" style="left:72%;top:40%" aria-label="花三">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <button class="target" type="button" data-stage="flower" style="left:83%;top:56%" aria-label="花四">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <button class="target" type="button" data-stage="flower" style="left:30%;top:64%" aria-label="花五">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <button class="target" type="button" data-stage="butterfly" style="left:32%;top:48%" aria-label="蝴蝶一">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <button class="target" type="button" data-stage="butterfly" style="left:74%;top:63%" aria-label="蝴蝶二">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <div class="complete-message" role="status">完成</div>
      </div>
    </section>
  </main>

  <script>
    const patternButtons = [...document.querySelectorAll(".pattern-option")];
    const targets = [...document.querySelectorAll(".target")];
    const patternList = document.querySelector(".pattern-list");
    const countLabel = document.getElementById("stamped-count");
    const stageTotal = document.getElementById("stage-total");
    const stageHeading = document.getElementById("stage-heading");
    const stageInstruction = document.getElementById("stage-instruction");
    const progressLabel = document.getElementById("progress-label");
    const gameStatus = document.getElementById("game-status");
    const garden = document.getElementById("garden");
    const sidebar = document.querySelector(".sidebar");
    const toggleControlsButton = document.getElementById("toggle-controls");
    const resetButton = document.getElementById("reset-game");
    const leafCanvas = document.getElementById("leaf-canvas");
    const leafBrushContext = leafCanvas.getContext("2d");
    const finishLeavesButton = document.getElementById("finish-leaves");
    const fabricOutput = document.getElementById("fabric-output");
    const fabricPreview = document.getElementById("fabric-preview");
    const fabricPreviewDialog = document.getElementById("fabric-preview-dialog");
    const showFabricPreviewButton = document.getElementById("show-fabric-preview");
    const closeFabricPreviewButton = document.getElementById("close-fabric-preview");
    const fabricStatus = document.getElementById("fabric-status");
    const previewFabricStatus = document.getElementById("preview-fabric-status");
    const fabricDownload = document.getElementById("fabric-download");
    const generateFabricButton = document.getElementById("generate-fabric");
    const fabricAiEndpointInput = document.getElementById("fabric-ai-endpoint");
    const saveFabricAiEndpointButton = document.getElementById("save-fabric-ai-endpoint");
    const fabricAiEndpointStorageKey = "nature-fabric-ai-endpoint";
    const butterflyPatterns = [
      { image: "B1.png", name: "蝴蝶" },
      { image: "B2.png", name: "蝴蝶" },
      { image: "b3.png", name: "蝴蝶" }
    ];
    let fabricAiEndpoint = "";
    try {
      fabricAiEndpoint = window.localStorage.getItem(fabricAiEndpointStorageKey) || "";
    } catch (error) {

    }
    fabricAiEndpointInput.value = fabricAiEndpoint;
    const stages = [
      { key: "leaf", kind: "leaf", name: "葉", heading: "葉", count: null },
      { key: "flower", kind: "flower", name: "花", heading: "花", count: 5 },
      { key: "butterfly", kind: "butterfly", name: "蝴蝶", heading: "蝴蝶", count: 2 }
    ];
    let stageIndex = 0;
    let selectedPattern = null;
    let patternLocked = false;
    let butterflyAssetsReady = false;
    let butterflyLoadError = null;
    let leafMarks = [];
    let lastBrushPoint = null;
    let brushDistance = 0;
    let lastBrushSize = 0;
    let nextLeafBrushSize = null;
    const minLeafBrushSize = 100;
    const maxLeafBrushSize = 200;
    const leafBrushGap = 5;
    const artImageCache = new Map();
    const loadedArtImages = new Map();
    let fabricObjectUrl = null;
    let fabricGeneration = 0;

    function setControlsCollapsed(collapsed) {
      sidebar.classList.toggle("collapsed", collapsed);
      toggleControlsButton.setAttribute("aria-expanded", String(!collapsed));
      toggleControlsButton.textContent = collapsed ? "操作" : "收起";

    function randomButterflyPattern() {
      return butterflyPatterns[Math.floor(Math.random() * butterflyPatterns.length)];
    }

    function randomButterflyPrintSize() {
      return 700 + Math.floor(Math.random() * 501);
    }

    function chooseRandomHintPosition(bounds, placed, minimumDistance, verticalMargin, blockedBounds, radius) {
      let candidate;
      let fallback;
      for (let attempt = 0; attempt < 120; attempt += 1) {
        candidate = {
          x: .15 + Math.random() * .7,
          y: verticalMargin + Math.random() * (1 - 2 * verticalMargin)
        };
        const x = candidate.x * bounds.width;
        const y = candidate.y * bounds.height;
        const overlapsControls = blockedBounds
          && x + radius >= blockedBounds.left
          && x - radius <= blockedBounds.right
          && y + radius >= blockedBounds.top
          && y - radius <= blockedBounds.bottom;
        if (overlapsControls) continue;
        fallback ||= candidate;
        if (placed.every((point) => Math.hypot(
          (candidate.x - point.x) * bounds.width,
          (candidate.y - point.y) * bounds.height
        ) >= minimumDistance)) return candidate;
      }
      return fallback || candidate;
    }

    function randomizeHintPositions() {
      const bounds = garden.getBoundingClientRect();
      const verticalMargin = Math.min(.43, Math.max(.17, .15 * bounds.width / bounds.height));
      const minimumDistance = Math.min(bounds.width, bounds.height) * .18;
      const sidebarBounds = sidebar.getBoundingClientRect();
      const blockedBounds = {
        left: sidebarBounds.left - bounds.left,
        right: sidebarBounds.right - bounds.left,
        top: sidebarBounds.top - bounds.top,
        bottom: sidebarBounds.bottom - bounds.top
      };
      const stampRadius = bounds.width * 1200 / 9000 + 8;
      const positions = [];
      targets.forEach((target) => {
        const point = chooseRandomHintPosition(
          bounds,
          positions,
          minimumDistance,
          verticalMargin,
          blockedBounds,
          stampRadius
        );
        positions.push(point);
        target.style.left = `${point.x * 100}%`;
        target.style.top = `${point.y * 100}%`;
      });

      const guidePositions = [];
      document.querySelectorAll(".leaf-guide").forEach((guide) => {
        const point = chooseRandomHintPosition(
          bounds,
          guidePositions,
          minimumDistance * .8,
          verticalMargin,
          blockedBounds,
          16
        );
        guidePositions.push(point);
        guide.style.left = `${point.x * 100}%`;
        guide.style.top = `${point.y * 100}%`;
      });
    }

    function updateStageView() {

      leafCanvas.hidden = leafMarks.length === 0 && stage?.key !== "leaf";

      if (stage?.key === "leaf") resizeLeafCanvas();
      patternButtons.forEach((button) => {

        button.disabled = complete || (patternLocked && stage.kind !== "leaf");
        button.setAttribute("aria-pressed", String(selectedPattern?.image === button.dataset.image));
      });

      targets.forEach((target) => {

        target.hidden = !complete && targetStage > stageIndex;
      });

      if (complete) {

      progressLabel.textContent = "進度";
      countLabel.textContent = String(stage.key === "leaf" ? leafMarks.length : stampedInStage);
      stageTotal.textContent = stage.count === null ? " 片" : ` / ${stage.count}`;
      if (stage.key === "leaf") {
        stageInstruction.textContent = "選葉，拖畫；完成後按「完成」。";
        return;
      }
      if (stage.key === "butterfly") {
        stageInstruction.textContent = "蝴蝶隨機，停在紅圈 1 秒。";
        return;
      }
      stageInstruction.innerHTML = selectedPattern
        ? `停在紅圈 <strong>1 秒</strong>。`
        : "選圖，停在紅圈 1 秒。";
    }

    patternButtons.forEach((button) => {
      button.addEventListener("click", async () => {
        if (button.disabled) return;
        selectedPattern = {
          image: button.dataset.image,
          name: button.dataset.name
        };
        updateStageView();
        setControlsCollapsed(true);
        const chosenPattern = selectedPattern;

        try {
          await loadArtImage(chosenPattern.image);
          if (selectedPattern !== chosenPattern) return;
          gameStatus.textContent = stages[stageIndex]?.key === "leaf" ? "拖動畫葉。" : "停在紅圈蓋印。";
        } catch (error) {

        }

    function getDisplayStampSize(printSize) {
      return printSize * garden.getBoundingClientRect().width / 4500;
    }

    function resizeVisibleStamps() {
      targets.forEach((target) => {
        if (target.dataset.printSize) {
          target.style.setProperty("--stamp-size", `${getDisplayStampSize(Number(target.dataset.printSize))}px`);
        }
      });
    }

    window.addEventListener("resize", () => {
      resizeLeafCanvas();
      resizeVisibleStamps();
    });

    function resizeLeafCanvas() {
      const bounds = garden.getBoundingClientRect();
      const pixelRatio = window.devicePixelRatio || 1;
      leafCanvas.width = Math.round(bounds.width * pixelRatio);
      leafCanvas.height = Math.round(bounds.height * pixelRatio);
      leafBrushContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      leafBrushContext.clearRect(0, 0, bounds.width, bounds.height);
      leafMarks.forEach((mark) => drawLeafMark(mark));
    }

    function drawLeafMark(mark) {
      const image = loadedArtImages.get(mark.image);
      if (!image || !leafBrushContext) return;
      const bounds = garden.getBoundingClientRect();
      const halfSize = mark.size / 2;
      leafBrushContext.save();
      leafBrushContext.translate(mark.x * bounds.width, mark.y * bounds.height);
      leafBrushContext.rotate(mark.angle);
      leafBrushContext.drawImage(image, -halfSize, -halfSize, mark.size, mark.size);
      leafBrushContext.restore();
    }

    function randomLeafBrushSize() {
      return minLeafBrushSize + Math.floor(Math.random() * (maxLeafBrushSize - minLeafBrushSize + 1));
    }

    function addLeafMark(x, y, angle, size) {
      if (!selectedPattern || !loadedArtImages.has(selectedPattern.image)) return null;
      const bounds = garden.getBoundingClientRect();
      const mark = {
        x: x / bounds.width,
        y: y / bounds.height,
        angle,
        size,
        image: selectedPattern.image
      };
      leafMarks.push(mark);
      drawLeafMark(mark);
      countLabel.textContent = String(leafMarks.length);
      stageTotal.textContent = " 片";
      finishLeavesButton.disabled = false;
      if (leafMarks.length === 1 || leafMarks.length % 20 === 0) {
        gameStatus.textContent = `已畫 ${leafMarks.length} 片。`;
      }
      return mark;
    }

    function paintLeafAtPointer(event) {
      if (event.target.closest(".sidebar")
        || stages[stageIndex]?.key !== "leaf"
        || !selectedPattern
        || !loadedArtImages.has(selectedPattern.image)) return;
      const bounds = garden.getBoundingClientRect();
      const edgeMargin = maxLeafBrushSize / 2;
      const current = {
        x: Math.max(edgeMargin, Math.min(event.clientX - bounds.left, bounds.width - edgeMargin)),
        y: Math.max(edgeMargin, Math.min(event.clientY - bounds.top, bounds.height - edgeMargin))
      };
      if (!lastBrushPoint) {
        const mark = addLeafMark(current.x, current.y, Math.random() * Math.PI * 2, randomLeafBrushSize());
        lastBrushPoint = current;
        lastBrushSize = mark.size;
        nextLeafBrushSize = randomLeafBrushSize();
        brushDistance = 0;
        return;
      }

      const deltaX = current.x - lastBrushPoint.x;
      const deltaY = current.y - lastBrushPoint.y;
      const distance = Math.hypot(deltaX, deltaY);
      if (!distance) return;

      let travelled = 0;
      let nextStep = (lastBrushSize + nextLeafBrushSize) / 2 + leafBrushGap - brushDistance;
      while (distance - travelled >= nextStep) {
        travelled += nextStep;
        const progress = travelled / distance;
        const x = lastBrushPoint.x + deltaX * progress;
        const y = lastBrushPoint.y + deltaY * progress;
        const direction = Math.atan2(deltaY, deltaX) + (Math.random() - .5) * .34;
        const mark = addLeafMark(x, y, direction, nextLeafBrushSize);
        lastBrushSize = mark.size;
        nextLeafBrushSize = randomLeafBrushSize();
        nextStep = (lastBrushSize + nextLeafBrushSize) / 2 + leafBrushGap;
      }
      brushDistance = travelled ? distance - travelled : brushDistance + distance;
      lastBrushPoint = current;
    }

    garden.addEventListener("pointerenter", (event) => {
      lastBrushPoint = null;
      brushDistance = 0;
      lastBrushSize = 0;
      nextLeafBrushSize = null;
      paintLeafAtPointer(event);
    });
    garden.addEventListener("pointermove", paintLeafAtPointer);
    garden.addEventListener("pointerleave", () => {
      lastBrushPoint = null;
      brushDistance = 0;
      lastBrushSize = 0;
      nextLeafBrushSize = null;
    });
    function stopStamping(target) {
      if (target.stampFrame) {
        cancelAnimationFrame(target.stampFrame);
        target.stampFrame = null;
      }
      target.style.removeProperty("--progress");
    }

    function startStamping(target) {
      const stage = stages[stageIndex];
      if (target.hidden || target.disabled || target.classList.contains("stamped") || target.stampFrame) return;
      if (!stage || target.dataset.stage !== stage.key) return;
      if (stage.key === "butterfly" && !butterflyAssetsReady) {
        gameStatus.textContent = butterflyLoadError
          ? `蝴蝶載入失敗：${butterflyLoadError.message}`
          : "蝴蝶載入中…";
        return;
      }
      if (stage.key !== "butterfly" && !selectedPattern) {
        gameStatus.textContent = "先選圖。";
        return;
      }
      const startedAt = performance.now();

      function updateProgress(now) {
        const progress = Math.min((now - startedAt) / 1000, 1);
        target.style.setProperty("--progress", String(progress * 100));
        if (progress === 1) {
          target.stampFrame = null;
          stamp(target);
          return;
        }
        target.stampFrame = requestAnimationFrame(updateProgress);
      }

      target.stampFrame = requestAnimationFrame(updateProgress);
    }

    function stamp(target) {
      const stage = stages[stageIndex];
      if (!stage || target.dataset.stage !== stage.key || target.classList.contains("stamped")) return;
      const stampPattern = stage.key === "butterfly" ? randomButterflyPattern() : selectedPattern;
      if (!stampPattern) return;
      const stampIndex = targets.filter((item) =>
        item.dataset.stage === stage.key && item.classList.contains("stamped")
      ).length;
      target.classList.add("stamped");
      const stampImage = target.querySelector(".stamp-image");
      stampImage.src = stampPattern.image;
      stampImage.alt = `${stampPattern.name}圖樣`;
      const printSize = stage.key === "butterfly"
        ? randomButterflyPrintSize()
        : stampIndex % 2 === 0 ? 300 : 600;
      target.dataset.printSize = String(printSize);
      target.style.setProperty("--stamp-size", `${getDisplayStampSize(printSize)}px`);
      target.dataset.image = stampPattern.image;
      target.setAttribute("aria-label", `${stage.name}：${stampPattern.name}圖樣，已蓋印`);
      target.setAttribute("aria-pressed", "true");
      target.disabled = true;
      target.style.removeProperty("--progress");
      patternLocked = true;

      if (stage.count === null) return;
      const stampedInStage = targets.filter((item) =>
        item.dataset.stage === stage.key && item.classList.contains("stamped")
      ).length;
      if (stampedInStage < stage.count) {
        updateStageView();
        gameStatus.textContent = `${stampedInStage} / ${stage.count}`;
        return;
      }

      stageIndex += 1;
      selectedPattern = null;
      patternLocked = false;
      updateStageView();
      if (stageIndex === stages.length) {
        garden.classList.add("complete");
        gameStatus.textContent = "製作花布…";
        generateAndShowFabric();
      } else {
        gameStatus.textContent = `完成，選${stages[stageIndex].name}。`;
      }
    }

    targets.forEach((target) => {
      target.addEventListener("pointerenter", () => startStamping(target));
      target.addEventListener("pointerleave", () => {
        if (!target.classList.contains("stamped")) stopStamping(target);
      });
      target.addEventListener("focus", () => startStamping(target));
      target.addEventListener("blur", () => {
        if (!target.classList.contains("stamped")) stopStamping(target);
      });
    });

    finishLeavesButton.addEventListener("click", () => {
      if (stages[stageIndex]?.key !== "leaf" || leafMarks.length === 0) return;
      stageIndex += 1;
      selectedPattern = null;
      patternLocked = false;
      lastBrushPoint = null;
      brushDistance = 0;
      lastBrushSize = 0;
      nextLeafBrushSize = null;
      updateStageView();
      setControlsCollapsed(false);
      gameStatus.textContent = `完成 ${leafMarks.length} 片。`;
    });

    function loadArtImage(src) {
      if (artImageCache.has(src)) return artImageCache.get(src);
      const imagePromise = new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => {
          loadedArtImages.set(src, image);
          resolve(image);
        };
        image.onerror = () => reject(new Error(`無法載入圖樣：${src}`));
        image.src = src;
      });
      artImageCache.set(src, imagePromise);
      imagePromise.catch(() => artImageCache.delete(src));
      return imagePromise;
    }

    Promise.all(butterflyPatterns.map((pattern) => loadArtImage(pattern.image)))
      .then(() => {
        butterflyAssetsReady = true;
      })
      .catch((error) => {
        butterflyLoadError = error;
        gameStatus.textContent = `蝴蝶載入失敗：${error.message}`;
      });

    showFabricPreviewButton.addEventListener("click", () => {
      if (!fabricPreviewDialog.open) fabricPreviewDialog.showModal();
    });
    closeFabricPreviewButton.addEventListener("click", () => fabricPreviewDialog.close());

    saveFabricAiEndpointButton.addEventListener("click", () => {
      const value = fabricAiEndpointInput.value.trim();
      if (!value) {
        try {
          window.localStorage.removeItem(fabricAiEndpointStorageKey);
          fabricAiEndpoint = "";
          fabricStatus.textContent = "已清除。";
        } catch (error) {
          fabricStatus.textContent = `無法清除 AI Worker 設定：${error.message}`;
        }
        return;
      }

      let endpoint;
      try {
        endpoint = new URL(value);
      } catch {
        fabricStatus.textContent = "網址無效。";
        return;
      }
      if (endpoint.protocol !== "https:" || endpoint.pathname !== "/" || endpoint.search || endpoint.hash) {
        fabricStatus.textContent = "請輸入 Worker 根網址。";
        return;
      }

      try {
        window.localStorage.setItem(fabricAiEndpointStorageKey, endpoint.origin);
        fabricAiEndpoint = endpoint.origin;
        fabricStatus.textContent = "已儲存。";
      } catch (error) {
        fabricStatus.textContent = `無法儲存 AI Worker 設定：${error.message}`;
      }
    });

    async function generateAIFabricBackground() {
      const response = await fetch(`${fabricAiEndpoint}/generate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}"
      });
      let result;
      try {
        result = await response.json();
      } catch {
        throw new Error(`AI Worker 回應格式無效（HTTP ${response.status}）。`);
      }
      if (!response.ok) throw new Error(result.error || `AI Worker 發生錯誤（HTTP ${response.status}）。`);
      if (typeof result.imageBase64 !== "string" || !result.imageBase64) {
        throw new Error("AI Worker 沒有回傳布底圖片。");
      }

      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("無法讀取 AI 生成的布底圖片。"));
        image.src = `data:image/png;base64,${result.imageBase64}`;
      });
    }

    function selectFabricLeafMarks(maxMarks = 12) {
      if (leafMarks.length <= maxMarks) return leafMarks;
      const selected = [leafMarks[0]];
      const minimumDistances = leafMarks.map((mark) => {
        const deltaX = mark.x - selected[0].x;
        const deltaY = mark.y - selected[0].y;
        return deltaX * deltaX + deltaY * deltaY;
      });

      while (selected.length < maxMarks) {
        let farthestIndex = -1;
        let farthestDistance = -1;
        minimumDistances.forEach((distance, index) => {
          if (distance > farthestDistance) {
            farthestDistance = distance;
            farthestIndex = index;
          }
        });
        const nextMark = leafMarks[farthestIndex];
        selected.push(nextMark);
        leafMarks.forEach((mark, index) => {
          const deltaX = mark.x - nextMark.x;
          const deltaY = mark.y - nextMark.y;
          minimumDistances[index] = Math.min(
            minimumDistances[index],
            deltaX * deltaX + deltaY * deltaY
          );
        });
      }

      return selected;
    }

    async function createFabricJpg(backgroundImage = null) {
      const fabricLeafMarks = selectFabricLeafMarks();
      const paperBounds = garden.getBoundingClientRect();
      const stamps = targets
        .filter((target) => target.dataset.image)
        .map((target) => {
          const bounds = target.getBoundingClientRect();
          return {
            stage: target.dataset.stage,
            src: target.dataset.image,
            size: Number(target.dataset.printSize),
            x: (bounds.left + bounds.width / 2 - paperBounds.left) / paperBounds.width,
            y: (bounds.top + bounds.height / 2 - paperBounds.top) / paperBounds.height
          };
        });
      if (stages.some((stage) => stage.key === "leaf"
        ? leafMarks.length === 0
        : !stamps.some((stamp) => stamp.stage === stage.key))) {
        throw new Error("缺少花、葉或蝴蝶印樣，請重新完成蓋印流程。");
      }

      const sources = [...new Set([...fabricLeafMarks.map((mark) => mark.image), ...stamps.map((stamp) => stamp.src)])];
      const loadedImages = new Map(await Promise.all(sources.map(async (src) => [src, await loadArtImage(src)])));
      const tile = document.createElement("canvas");
      tile.width = 4500;
      tile.height = 4500;
      const tileContext = tile.getContext("2d");
      if (!tileContext) throw new Error("無法建立花布圖樣畫布。");

      if (backgroundImage) {
        tileContext.drawImage(backgroundImage, 0, 0, tile.width, tile.height);
      } else {
        const motifTile = document.createElement("canvas");
        motifTile.width = 240;
        motifTile.height = 240;
        const motifContext = motifTile.getContext("2d");
        if (!motifContext) throw new Error("無法建立花布底紋畫布。");
        motifContext.fillStyle = "#a71922";
        motifContext.fillRect(0, 0, motifTile.width, motifTile.height);
        motifContext.strokeStyle = "rgba(241, 205, 126, .28)";
        motifContext.lineWidth = 3;
        motifContext.lineJoin = "round";
        motifContext.beginPath();
        motifContext.moveTo(120, 35);
        motifContext.lineTo(205, 120);
        motifContext.lineTo(120, 205);
        motifContext.lineTo(35, 120);
        motifContext.closePath();
        motifContext.stroke();
        motifContext.beginPath();
        motifContext.arc(120, 120, 38, 0, Math.PI * 2);
        motifContext.arc(120, 120, 25, 0, Math.PI * 2);
        motifContext.stroke();
        motifContext.fillStyle = "rgba(241, 205, 126, .32)";
        [[120, 70], [170, 120], [120, 170], [70, 120]].forEach(([x, y]) => {
          motifContext.beginPath();
          motifContext.arc(x, y, 4, 0, Math.PI * 2);
          motifContext.fill();
        });
        const textilePattern = tileContext.createPattern(motifTile, "repeat");
        if (!textilePattern) throw new Error("無法建立紅色花布底紋。");
        tileContext.fillStyle = textilePattern;
        tileContext.fillRect(0, 0, tile.width, tile.height);
      }
      const borderInset = 52;
      tileContext.save();
      tileContext.strokeStyle = "rgba(241, 205, 126, .62)";
      tileContext.fillStyle = "rgba(241, 205, 126, .72)";
      tileContext.lineWidth = 7;
      tileContext.strokeRect(borderInset, borderInset, tile.width - borderInset * 2, tile.height - borderInset * 2);
      tileContext.lineWidth = 3;
      tileContext.strokeRect(borderInset + 18, borderInset + 18, tile.width - (borderInset + 18) * 2, tile.height - (borderInset + 18) * 2);

      function drawBorderDiamond(x, y) {
        tileContext.beginPath();
        tileContext.moveTo(x, y - 16);
        tileContext.lineTo(x + 16, y);
        tileContext.lineTo(x, y + 16);
        tileContext.lineTo(x - 16, y);
        tileContext.closePath();
        tileContext.stroke();
        tileContext.beginPath();
        tileContext.arc(x, y, 4, 0, Math.PI * 2);
        tileContext.fill();
      }

      for (let x = borderInset + 58; x < tile.width - borderInset - 40; x += 180) {
        drawBorderDiamond(x, borderInset + 11);
        drawBorderDiamond(x, tile.height - borderInset - 11);
      }
      for (let y = borderInset + 58; y < tile.height - borderInset - 40; y += 180) {
        drawBorderDiamond(borderInset + 11, y);
        drawBorderDiamond(tile.width - borderInset - 11, y);
      }
      tileContext.restore();
      tileContext.imageSmoothingEnabled = true;
      tileContext.imageSmoothingQuality = "high";
      const repeatUnitWidth = tile.width / 3;
      const repeatScale = repeatUnitWidth / paperBounds.width;
      const repeatUnitHeight = paperBounds.height * repeatScale;
      const repeatOffsets = [];
      for (let y = 0; y < tile.height; y += repeatUnitHeight) {
        for (let x = 0; x < tile.width; x += repeatUnitWidth) {
          repeatOffsets.push({ x, y });
        }
      }

      function drawRepeatedStamp(image, x, y, size, angle, repeatOffset) {
        const halfSize = size / 2;
        const edgeReach = halfSize * Math.SQRT2;
        const xOffsets = [0];
        const yOffsets = [0];
        if (x < edgeReach) xOffsets.push(repeatUnitWidth);
        if (x > repeatUnitWidth - edgeReach) xOffsets.push(-repeatUnitWidth);
        if (y < edgeReach) yOffsets.push(repeatUnitHeight);
        if (y > repeatUnitHeight - edgeReach) yOffsets.push(-repeatUnitHeight);
        xOffsets.forEach((offsetX) => yOffsets.forEach((offsetY) => {
          tileContext.save();
          tileContext.translate(x + repeatOffset.x + offsetX, y + repeatOffset.y + offsetY);
          tileContext.rotate(angle);
          tileContext.drawImage(image, -halfSize, -halfSize, size, size);
          tileContext.restore();
        }));
      }

      repeatOffsets.forEach((repeatOffset) => {
        fabricLeafMarks.forEach((mark) => {
          drawRepeatedStamp(
            loadedImages.get(mark.image),
            mark.x * repeatUnitWidth,
            mark.y * repeatUnitHeight,
            mark.size * repeatScale,
            mark.angle,
            repeatOffset
          );
        });
      });

      repeatOffsets.forEach((repeatOffset) => {
        stamps.forEach((stamp) => {
          drawRepeatedStamp(
            loadedImages.get(stamp.src),
            stamp.x * repeatUnitWidth,
            stamp.y * repeatUnitHeight,
            stamp.size * repeatUnitWidth / tile.width,
            -8 * Math.PI / 180,
            repeatOffset
          );
        });
      });

      return new Promise((resolve, reject) => {
        tile.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error("瀏覽器無法輸出 JPG。"));
        }, "image/jpeg", .94);
      });
    }

    async function generateAndShowFabric() {
      const generation = ++fabricGeneration;
      generateFabricButton.disabled = true;
      fabricStatus.textContent = "製作中…";
      try {
        const backgroundImage = fabricAiEndpoint ? await generateAIFabricBackground() : null;
        const blob = await createFabricJpg(backgroundImage);
        if (generation !== fabricGeneration) return;
        if (fabricObjectUrl) URL.revokeObjectURL(fabricObjectUrl);
        fabricObjectUrl = URL.createObjectURL(blob);
        fabricPreview.src = fabricObjectUrl;
        fabricDownload.href = fabricObjectUrl;
        fabricDownload.hidden = false;
        showFabricPreviewButton.hidden = false;
        fabricStatus.textContent = backgroundImage ? "完成（AI 布底）。" : "完成。";
        previewFabricStatus.textContent = fabricStatus.textContent;
        if (!fabricPreviewDialog.open) fabricPreviewDialog.showModal();
      } catch (error) {
        if (generation === fabricGeneration) fabricStatus.textContent = `花布生成失敗：${error.message}`;
      } finally {
        if (generation === fabricGeneration) generateFabricButton.disabled = false;
      }
    }

    generateFabricButton.addEventListener("click", generateAndShowFabric);

    resetButton.addEventListener("click", () => {
      fabricGeneration += 1;
      generateFabricButton.disabled = false;
      targets.forEach((target) => {
        if (target.stampFrame) cancelAnimationFrame(target.stampFrame);
        target.stampFrame = null;
        target.classList.remove("stamped");
        const stampImage = target.querySelector(".stamp-image");
        stampImage.removeAttribute("src");
        stampImage.alt = "";
        delete target.dataset.image;
        target.setAttribute("aria-label", `位置${targets.indexOf(target) + 1}`);
        target.removeAttribute("aria-pressed");
        target.disabled = false;
        target.style.removeProperty("--progress");
        target.style.removeProperty("--stamp-size");
        delete target.dataset.printSize;
      });
      stageIndex = 0;
      selectedPattern = null;
      patternLocked = false;
      if (fabricObjectUrl) URL.revokeObjectURL(fabricObjectUrl);
      fabricObjectUrl = null;
      fabricPreview.removeAttribute("src");
      fabricDownload.removeAttribute("href");
      fabricDownload.hidden = true;
      showFabricPreviewButton.hidden = true;
      if (fabricPreviewDialog.open) fabricPreviewDialog.close();
      leafMarks = [];
      lastBrushPoint = null;
      brushDistance = 0;
      lastBrushSize = 0;
      nextLeafBrushSize = null;
      resizeLeafCanvas();
      fabricStatus.textContent = "尚未生成。";
      previewFabricStatus.textContent = "";
      gameStatus.textContent = "選一款葉片。";
      garden.classList.remove("complete");
      setControlsCollapsed(true);
      randomizeHintPositions();
      updateStageView();
    });

    randomizeHintPositions();
    updateStageView();
  </script>
</body>
