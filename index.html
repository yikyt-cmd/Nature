<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5e9">
  <title>花鳥蓋印所 — 國風圖樣小遊戲</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Avenir Next", Avenir, "Noto Sans TC", "PingFang TC", sans-serif;
      color: #293d31;
      background: #f8f5e9;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --leaf: #64845c;
      --deep-leaf: #37563f;
      --paper: #ffffff;
      --muted: #788274;
      --vermilion: #a9362b;
      --gold: #bd9652;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 8% 8%, rgba(223, 229, 197, .58), transparent 34rem),
        radial-gradient(ellipse at 92% 88%, rgba(239, 218, 180, .38), transparent 33rem),
        #f8f5e9;
    }

    button { font: inherit; }

    .page {
      width: min(1320px, calc(100% - 48px));
      margin: 0 auto;
      padding: 30px 0 42px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid rgba(169, 54, 43, .48);
      border-radius: 10px;
      color: var(--vermilion);
      background: #fffaf3;
      box-shadow: inset 0 0 0 3px #fffaf3, inset 0 0 0 4px rgba(169, 54, 43, .28);
      font-family: "Noto Serif TC", "Songti TC", serif;
      font-size: 18px;
      font-weight: 800;
    }

    .season-tag {
      padding: 8px 13px;
      border: 1px solid rgba(83, 106, 73, .15);
      border-radius: 99px;
      color: #65735d;
      background: rgba(255, 253, 246, .62);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .07em;
    }

    .intro {
      margin-bottom: 27px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #82916f;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .2em;
    }

    h1 {
      margin: 0;
      color: #304b38;
      font-family: Georgia, "Noto Serif TC", serif;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 700;
      letter-spacing: .06em;
    }

    .subtitle {
      margin: 10px 0 0;
      color: #7d8578;
      font-size: 14px;
      letter-spacing: .035em;
    }

    .game-card {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 18px;
      padding: 0;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      padding: 18px 8px 12px 10px;
    }

    .section-label {
      margin: 0 0 13px;
      color: #75816d;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .15em;
    }

    .pattern-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .pattern-option {
      display: flex;
      min-height: 82px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 4px;
      border: 1px solid #e8ded1;
      border-radius: 12px;
      color: #596653;
      background: #fffdfa;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .pattern-option:hover { transform: translateY(-2px); }

    .pattern-option[aria-pressed="true"] {
      border-color: var(--vermilion);
      background: #fff8f1;
      box-shadow: 0 0 0 2px rgba(169, 54, 43, .1);
    }

    .pattern-preview {
      width: 42px;
      height: 42px;
      border: 1px solid #e8d6c6;
      border-radius: 50%;
      background: #fff;
      object-fit: cover;
    }

    .pattern-name { color: #685344; font-size: 11px; font-weight: 700; }

    .instruction {
      margin: 19px 0 0;
      padding: 13px 14px;
      border-radius: 14px;
      color: #64715e;
      background: #f1f1e5;
      font-size: 12px;
      line-height: 1.8;
    }

    .instruction strong { color: #405944; }

    .progress-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding: 17px 3px 4px;
    }

    .progress-label {
      color: #7b8476;
      font-size: 12px;
    }

    .progress-count {
      color: #476448;
      font-family: Georgia, serif;
      font-size: 22px;
      font-weight: 700;
    }

    .progress-count small {
      color: #9aa091;
      font-family: inherit;
      font-size: 14px;
      font-weight: 400;
    }

    .reset {
      width: 100%;
      margin-top: 9px;
      padding: 10px 14px;
      border: 1px solid #dfe3d3;
      border-radius: 12px;
      color: #65745f;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: background .18s ease;
    }

    .reset:hover { background: #f2f3e9; }

    .garden {
      position: relative;
      min-height: max(560px, min(76vh, 760px));
      overflow: hidden;
      background: var(--paper);
      isolation: isolate;
    }

    .garden::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      background-image: radial-gradient(rgba(132, 92, 63, .1) .55px, transparent .55px);
      background-size: 17px 17px;
      content: "";
      opacity: .18;
      pointer-events: none;
    }

    .garden-note {
      position: absolute;
      top: 21px;
      left: 23px;
      z-index: 1;
      color: #8d5c4c;
      font-family: Georgia, "Noto Serif TC", serif;
      font-size: 12px;
      letter-spacing: .12em;
      pointer-events: none;
    }

    .garden-note span {
      display: block;
      margin-top: 4px;
      color: #a1816a;
      font-family: "Avenir Next", Avenir, "Noto Sans TC", sans-serif;
      font-size: 10px;
      letter-spacing: .08em;
    }

    .leaf-decoration {
      position: absolute;
      z-index: -1;
      color: rgba(169, 54, 43, .1);
      font-family: "Noto Serif TC", "Songti TC", serif;
      font-size: 82px;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .leaf-one { right: 16px; bottom: 12px; transform: rotate(-15deg); }
    .leaf-two { top: 54px; right: 40px; transform: rotate(8deg) scale(.58); }

    .target {
      position: absolute;
      display: grid;
      width: 104px;
      height: 104px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: crosshair;
      transform: translate(-50%, -50%);
      -webkit-tap-highlight-color: transparent;
    }

    .target:focus-visible {
      outline: 2px solid #60845a;
      outline-offset: 3px;
    }

    .target-glow {
      position: absolute;
      inset: 12px;
      border: 1px dashed rgba(125, 150, 100, .48);
      border-radius: 50%;
      background: rgba(228, 236, 208, .48);
      box-shadow: 0 0 14px 5px rgba(189, 210, 149, .4);
      animation: breathe 2.4s ease-in-out infinite;
      transition: opacity .25s ease, transform .25s ease;
    }

    .target-glow::after {
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(137, 159, 108, .35);
      border-radius: 50%;
      content: "";
    }

    .target-progress {
      position: absolute;
      z-index: 1;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(var(--gold) calc(var(--progress, 0) * 1%), transparent 0);
      opacity: .9;
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
      pointer-events: none;
    }

    .target-stamp {
      position: relative;
      z-index: 2;
      display: grid;
      width: 92px;
      height: 92px;
      place-items: center;
      border: 0;
      background: transparent;
      box-shadow: none;
      opacity: .38;
      transform: scale(.7);
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
    }

    .stamp-image {
      display: block;
      width: 82px;
      height: 82px;
      object-fit: contain;
    }

    .target:not(.stamped):hover .target-glow,
    .target:not(.stamped):focus-visible .target-glow {
      transform: scale(1.12);
    }

    .target.stamped { cursor: default; }

    .target.stamped .target-glow {
      border-color: rgba(108, 132, 87, .15);
      background: rgba(221, 231, 199, .17);
      box-shadow: none;
      animation: none;
      opacity: .55;
    }

    .target.stamped .target-progress { display: none; }

    .target.stamped .target-stamp {
      border: 0;
      background: transparent;
      box-shadow: none;
      opacity: 1;
      filter: saturate(1.2) contrast(1.04);
      transform: scale(1) rotate(-12deg);
      animation: stamp-in .42s cubic-bezier(.2, 1.6, .35, 1) both;
    }

    .target.stamped:nth-of-type(even) .target-stamp { transform: scale(1) rotate(10deg); }
    .target.stamped .stamp-image { width: 82px; height: 82px; }

    .complete-message {
      position: absolute;
      right: 20px;
      bottom: 17px;
      left: 20px;
      z-index: 2;
      color: #52724e;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
    }

    .garden.complete .complete-message { opacity: 1; transform: translateY(0); }

    .footer-note {
      margin: 17px 0 0;
      color: #929687;
      font-size: 11px;
      text-align: center;
      letter-spacing: .04em;
    }

    @keyframes breathe {
      0%, 100% { opacity: .65; transform: scale(.94); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes stamp-in {
      0% { opacity: 0; transform: scale(1.65) rotate(-18deg); }
      70% { opacity: 1; transform: scale(.88) rotate(5deg); }
      100% { opacity: 1; transform: scale(1) rotate(-8deg); }
    }

    @media (max-width: 760px) {
      .page { width: min(600px, calc(100% - 28px)); padding-top: 18px; }
      .topbar { margin-bottom: 27px; }
      .game-card { grid-template-columns: 1fr; gap: 10px; padding: 14px; }
      .sidebar { padding: 8px 3px 0; }
      .pattern-list { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
      .pattern-option { min-height: 74px; border-radius: 10px; }
      .pattern-preview { width: 38px; height: 38px; }
      .pattern-name { font-size: 10px; }
      .instruction { margin-top: 12px; padding: 9px 12px; }
      .progress-card { padding-top: 10px; }
      .reset { margin-top: 5px; }
      .garden { min-height: max(480px, min(72vh, 680px)); }
      .target { width: 84px; height: 84px; }
      .target-stamp { width: 74px; height: 74px; }
      .stamp-image, .target.stamped .stamp-image { width: 64px; height: 64px; }
    }

    @media (max-width: 430px) {
      .page { width: calc(100% - 20px); }
      .game-card { padding: 10px; }
      .pattern-list { gap: 4px; }
      .pattern-option { min-height: 66px; padding: 5px 2px; }
      .pattern-preview { width: 34px; height: 34px; }
      .pattern-name { font-size: 9px; }
      .garden { min-height: max(420px, min(72vh, 620px)); }
      .garden-note { top: 15px; left: 16px; }
      .target { width: 74px; height: 74px; }
      .target-stamp { width: 66px; height: 66px; }
      .stamp-image, .target.stamped .stamp-image { width: 58px; height: 58px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">印</span><span>紙上花園</span></div>
      <span class="season-tag">花鳥小集 · 春</span>
    </header>

    <section class="intro" aria-labelledby="game-title">
      <p class="eyebrow">A LITTLE GARDEN OF SEALS</p>
      <h1 id="game-title">花鳥蓋印所</h1>
      <p class="subtitle">選一款花鳥圖樣，在素箋上留下朱紅印記。</p>
    </section>

    <section class="game-card" aria-label="花鳥蓋印遊戲">
      <aside class="sidebar">
        <h2 class="section-label">01　選擇花鳥印樣</h2>
        <div class="pattern-list" role="group" aria-label="選擇蓋印圖樣">
          <button class="pattern-option" type="button" data-image="crocus-1279508_1280.webp" data-name="紫花" aria-pressed="true" aria-label="選擇紫花圖樣">
            <img class="pattern-preview" src="crocus-1279508_1280.webp" alt=""><span class="pattern-name">紫花</span>
          </button>
          <button class="pattern-option" type="button" data-image="vibrant-yellow-bird-flight-stunning-display-avian-beauty_191095-78032.avif" data-name="金鳥" aria-pressed="false" aria-label="選擇金鳥圖樣">
            <img class="pattern-preview" src="vibrant-yellow-bird-flight-stunning-display-avian-beauty_191095-78032.avif" alt=""><span class="pattern-name">金鳥</span>
          </button>
          <button class="pattern-option" type="button" data-image="9ae5cb84d561e853cb062901367e86f4.png" data-name="青葉" aria-pressed="false" aria-label="選擇青葉圖樣">
            <img class="pattern-preview" src="9ae5cb84d561e853cb062901367e86f4.png" alt=""><span class="pattern-name">青葉</span>
          </button>
          <button class="pattern-option" type="button" data-image="pngtree-small-cute-bird-png-image_9959508.png" data-name="雀鳥" aria-pressed="false" aria-label="選擇雀鳥圖樣">
            <img class="pattern-preview" src="pngtree-small-cute-bird-png-image_9959508.png" alt=""><span class="pattern-name">雀鳥</span>
          </button>
          <button class="pattern-option" type="button" data-image="pngtree-mugunghwa-pink-flower-of-korea-png-png-image_11494956.png" data-name="木槿" aria-pressed="false" aria-label="選擇木槿圖樣">
            <img class="pattern-preview" src="pngtree-mugunghwa-pink-flower-of-korea-png-png-image_11494956.png" alt=""><span class="pattern-name">木槿</span>
          </button>
        </div>

        <p class="instruction">找到素箋上的點點微光，將滑鼠停留 <strong>1 秒</strong>，圖樣便會化作一方小印。</p>

        <div class="progress-card" aria-live="polite">
          <span class="progress-label">印譜完成</span>
          <span class="progress-count"><span id="stamped-count">0</span><small> / 6</small></span>
        </div>
        <button class="reset" id="reset-game" type="button">↻　重新開始</button>
      </aside>

      <div class="garden" id="garden" aria-label="花鳥印箋，移到發光提示點並停留一秒">
        <div class="garden-note">花鳥印箋<span>一紙留白，循光落印</span></div>
        <span class="leaf-decoration leaf-one" aria-hidden="true">印</span>
        <span class="leaf-decoration leaf-two" aria-hidden="true">花</span>
        <button class="target" type="button" style="left:19%;top:35%" aria-label="尚未蓋印的位置一">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <button class="target" type="button" style="left:43%;top:27%" aria-label="尚未蓋印的位置二">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <button class="target" type="button" style="left:70%;top:37%" aria-label="尚未蓋印的位置三">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <button class="target" type="button" style="left:29%;top:62%" aria-label="尚未蓋印的位置四">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <button class="target" type="button" style="left:56%;top:70%" aria-label="尚未蓋印的位置五">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <button class="target" type="button" style="left:82%;top:63%" aria-label="尚未蓋印的位置六">
          <span class="target-glow" aria-hidden="true"></span><span class="target-progress" aria-hidden="true"></span><span class="target-stamp" aria-hidden="true"><img class="stamp-image" alt=""></span>
        </button>
        <div class="complete-message" role="status">花鳥印譜完成，雅趣盎然。</div>
      </div>
    </section>
    <p class="footer-note">以花為箋，以鳥為印，慢慢留住一方春意。</p>
  </main>

  <script>
    const patternButtons = [...document.querySelectorAll(".pattern-option")];
    const targets = [...document.querySelectorAll(".target")];
    const countLabel = document.getElementById("stamped-count");
    const garden = document.getElementById("garden");
    const resetButton = document.getElementById("reset-game");
    let selectedPattern = {
      image: "crocus-1279508_1280.webp",
      name: "紫花"
    };
    let stampedCount = 0;

    patternButtons.forEach((button) => {
      button.addEventListener("click", () => {
        patternButtons.forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
        selectedPattern = {
          image: button.dataset.image,
          name: button.dataset.name
        };
      });
    });

    function stopStamping(target) {
      if (target.stampFrame) {
        cancelAnimationFrame(target.stampFrame);
        target.stampFrame = null;
      }
      target.style.removeProperty("--progress");
    }

    function startStamping(target) {
      if (target.classList.contains("stamped") || target.stampFrame) return;
      const startedAt = performance.now();

      function updateProgress(now) {
        const progress = Math.min((now - startedAt) / 1000, 1);
        target.style.setProperty("--progress", String(progress * 100));
        if (progress === 1) {
          target.stampFrame = null;
          stamp(target);
          return;
        }
        target.stampFrame = requestAnimationFrame(updateProgress);
      }

      target.stampFrame = requestAnimationFrame(updateProgress);
    }

    function stamp(target) {
      if (target.classList.contains("stamped")) return;
      target.classList.add("stamped");
      const stampImage = target.querySelector(".stamp-image");
      stampImage.src = selectedPattern.image;
      stampImage.alt = `${selectedPattern.name}圖樣`;
      target.setAttribute("aria-label", `${selectedPattern.name}圖樣，已蓋印`);
      target.setAttribute("aria-pressed", "true");
      target.disabled = true;
      target.style.removeProperty("--progress");
      stampedCount += 1;
      countLabel.textContent = String(stampedCount);
      if (stampedCount === targets.length) garden.classList.add("complete");
    }

    targets.forEach((target) => {
      target.addEventListener("pointerenter", () => startStamping(target));
      target.addEventListener("pointerleave", () => {
        if (!target.classList.contains("stamped")) stopStamping(target);
      });
      target.addEventListener("focus", () => startStamping(target));
      target.addEventListener("blur", () => {
        if (!target.classList.contains("stamped")) stopStamping(target);
      });
    });

    resetButton.addEventListener("click", () => {
      targets.forEach((target) => {
        if (target.stampFrame) cancelAnimationFrame(target.stampFrame);
        target.stampFrame = null;
        target.classList.remove("stamped");
        const stampImage = target.querySelector(".stamp-image");
        stampImage.removeAttribute("src");
        stampImage.alt = "";
        target.setAttribute("aria-label", `尚未蓋印的位置${targets.indexOf(target) + 1}`);
        target.removeAttribute("aria-pressed");
        target.disabled = false;
        target.style.removeProperty("--progress");
      });
      stampedCount = 0;
      countLabel.textContent = "0";
      garden.classList.remove("complete");
    });
  </script>
</body>
</html>
